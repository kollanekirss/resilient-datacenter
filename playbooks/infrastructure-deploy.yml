- import_playbook: infrastructure-preflight.yml

- name: Install owned independent controller with explicit policy
  hosts: controller
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [../versions.yml]
  vars:
    profile_policy: '{{ hostvars["localhost"].profile.policy }}'
    profile_relays: '{{ hostvars["localhost"].profile.relays }}'
    profile_relay_host: '{{ hostvars["localhost"].profile.relay_host }}'
  pre_tasks:
    - name: Claim validated controller
      ansible.builtin.import_role:
        name: profile_guard
      vars:
        profile_claim: true
    - name: Require explicit profile policy and relay selection
      ansible.builtin.assert:
        that:
          - profile_policy is mapping
          - "'grants' in profile_policy"
          - profile_relay_host in groups.relay
  roles: [controller]

- name: Install owned independent relay
  hosts: relay
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [../versions.yml]
  pre_tasks:
    - name: Claim validated relay
      ansible.builtin.import_role:
        name: profile_guard
      vars:
        profile_claim: true
  roles: [relay]
