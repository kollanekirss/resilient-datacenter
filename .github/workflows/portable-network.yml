name: Disposable portable local network
on:
  push:
    branches: [main, feat/portable-local-network]
  pull_request:
permissions:
  contents: read
jobs:
  local-dns-time:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare throwaway Linux software
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unbound chrony nftables netplan.io
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Exercise real local DNS, time and guest filtering without WAN routes
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .venv/bin/python scripts/ci_portable_network.py
      - name: Show disposable daemon logs on failure
        if: failure()
        run: sudo sh -c 'cat /var/lib/rdc-portable-network-ci/*.log'
