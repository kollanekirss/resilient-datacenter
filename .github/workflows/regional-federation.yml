name: Disposable independent regional federation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  independent-networks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare disposable runner
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y podman nftables iptables
      - name: Exercise real independent networks and approved Matrix exchange
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .venv/bin/python scripts/ci_regional_matrix.py
      - name: Collect bounded disposable network diagnostics on failure
        if: failure()
        run: |
          sudo .venv/bin/python - <<'PY'
          from pathlib import Path
          for path in Path('/var/lib/rdc-regional-network-ci').glob('*.log'):
              print(path.name)
              lines=path.read_text(errors='replace').splitlines()[-35:]
              for line in lines:
                  if not any(term in line.lower() for term in ('auth','token','key=','key:','register')):
                      print(line[:500])
          PY
          sudo podman ps --all --format '{{.Names}} {{.Status}}'
          for node in north south; do
            sudo podman logs --tail 50 "$node-postgres" || true
            sudo podman logs --tail 70 "$node-synapse" || true
            sudo podman logs --tail 50 "$node-proxy" || true
            sudo podman logs --tail 50 "$node-gateway-proxy" || true
          done
