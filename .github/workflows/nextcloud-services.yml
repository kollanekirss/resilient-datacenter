name: Disposable Nextcloud services
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  nextcloud-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare disposable runner
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-ci-browser.txt
          sudo apt-get update -qq
          sudo apt-get install -y podman nftables openssh-server libnss3-tools
          sudo .venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise the actual Nextcloud package with trusted HTTPS
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .venv/bin/python scripts/ci_nextcloud_services.py
      - name: Collect disposable application diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status rdc-nextcloud-postgres rdc-nextcloud rdc-nextcloud-proxy rdc-nextcloud-cron --no-pager || true
          sudo journalctl -u rdc-nextcloud-postgres -u rdc-nextcloud -u rdc-nextcloud-proxy -u rdc-nextcloud-cron --no-pager --lines=120
          sudo systemctl status rdc-backup-sshd tailscaled rdc-backup --no-pager || true
          sudo journalctl -u rdc-backup-sshd -u tailscaled -u rdc-backup --no-pager --lines=100
          sudo journalctl -k --no-pager --lines=250
          sudo aa-status || true
          sudo podman info --format '{{json .Host.Security}}'
