name: Portable installation media
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/guest_media.py'
      - 'scripts/guest_media.json'
      - 'scripts/ci_portable_media.py'
      - '.github/workflows/portable-media.yml'
permissions:
  contents: read
jobs:
  verify-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download and verify pinned vendor media without execution
        run: |
          python scripts/ci_portable_media.py
