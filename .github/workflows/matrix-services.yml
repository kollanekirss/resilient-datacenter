name: Disposable Matrix services
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  matrix-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare disposable runner
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y podman
      - name: Exercise the actual Matrix package with trusted HTTPS
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .venv/bin/python scripts/ci_matrix_services.py
      - name: Collect disposable application diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status rdc-postgres rdc-synapse rdc-element rdc-service-proxy --no-pager || true
          sudo journalctl -u rdc-postgres -u rdc-synapse -u rdc-element -u rdc-service-proxy --no-pager --lines=120
