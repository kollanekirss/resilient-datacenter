name: Disposable infrastructure resilience
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  certificate-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare disposable runner dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables openssh-server python3-yaml python3-cryptography
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Exercise actual relay failover and enrolled-controller recovery
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .venv/bin/python scripts/ci_infrastructure_resilience.py
      - name: Collect disposable service diagnostics on failure
        if: failure()
        run: sudo journalctl -u headscale -u sc-derp -u rdc-backup -u rdc-backup-sshd --no-pager --lines=100
