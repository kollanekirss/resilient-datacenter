name: Disposable portable applications
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  portable-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [chat, files]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare disposable Linux dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y podman runc nftables nginx
          sudo systemctl disable --now nginx.service
      - name: Exercise local access and recovery with WAN blocked
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .venv/bin/python scripts/ci_portable_applications.py ${{ matrix.role }}
      - name: Restore disposable runner connectivity
        if: always()
        run: sudo nft delete table inet rdc_ci_offline 2>/dev/null || true
      - name: Collect service diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status rdc-frontend rdc-postgres rdc-synapse rdc-element rdc-service-proxy rdc-nextcloud-postgres rdc-nextcloud rdc-nextcloud-proxy --no-pager || true
          sudo journalctl -u rdc-frontend -u rdc-postgres -u rdc-synapse -u rdc-service-proxy -u rdc-nextcloud-postgres -u rdc-nextcloud -u rdc-nextcloud-proxy --no-pager --lines=100
          sudo nft list ruleset
          sudo ip netns exec rdc-front nft list ruleset || true
