name: Disposable home NAT and fresh VM recovery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  personal-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [matrix, nextcloud]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare disposable VM host
        run: |
          test -c /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils nftables openssh-server
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Exercise installation and fenced recovery behind NAT
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .venv/bin/python scripts/ci_home_nat.py ${{ matrix.package }}
      - name: Collect bounded host diagnostics
        if: failure()
        run: |
          sudo journalctl -u tailscaled -u rdc-backup-sshd --no-pager --lines=60
          sudo find /var/lib/rdc-home-ci -name qemu.log -exec tail -n 15 {} \;
