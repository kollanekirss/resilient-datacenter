name: Disposable encrypted backup
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backup-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare disposable dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
      - name: Exercise encrypted SFTP backup and isolated restore
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .venv/bin/python scripts/ci_backup_transport.py
      - name: Collect disposable service diagnostics on failure
        if: failure()
        run: sudo journalctl -u rdc-backup-sshd --no-pager --lines=100
