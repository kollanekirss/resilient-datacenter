name: Offline recovery readiness assessment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/readiness_checks.py'
      - 'scripts/recovery_readiness.py'
      - 'scripts/private_recovery_contract.py'
      - 'tests/test_readiness_checks.py'
      - 'tests/test_recovery_readiness.py'
      - '.github/workflows/recovery-readiness.yml'
permissions:
  contents: read
jobs:
  offline-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare disposable test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Assess synthetic evidence without network access
        run: sudo unshare --net .venv/bin/python -m pytest -q tests/test_readiness_checks.py tests/test_recovery_readiness.py
