name: Experimental release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kollanekirss/resilient-datacenter' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate and test the exact release checkout
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python scripts/check_local.py
          .venv/bin/python scripts/release_build.py --version "${RELEASE_TAG#v}"
      - name: Attest every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/release/*
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kollanekirss/resilient-datacenter
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cp "docs/release-notes/${RELEASE_TAG#v}.md" .work/release-notes.md
          printf '\nSource commit: %s\n' "$RELEASE_COMMIT" >> .work/release-notes.md
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --prerelease --title "$RELEASE_TAG — experimental" --notes-file .work/release-notes.md
