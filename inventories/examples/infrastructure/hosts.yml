# Invalid-by-default documentation example. Prefer the guided wizard.
all:
  vars:
    schema_version: 2
    deployment_mode: independent
    institution_id: south
    headscale_hostname: control.example.com
    derp_hostname: relay.example.com
    enrollment_admin: lab-admin
    derper_artifact: /local/derper
    derper_sha256: REPLACE_WITH_VERIFIED_SHA256
    enrollment_nodes:
    - name: south-services
      node_tag: tag:south-services
  children:
    controller:
      hosts:
        north-control:
          ansible_host: 192.0.2.10
          ansible_user: ubuntu
          tls_certificate: /local/control.crt
          tls_private_key: /local/control.key
    relay:
      hosts:
        west-relay:
          ansible_host: 192.0.2.11
          ansible_user: ubuntu
          tls_certificate: /local/relay.crt
          tls_private_key: /local/relay.key
