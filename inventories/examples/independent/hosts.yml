# Invalid-by-default example. Copy to inventories/lab/ and replace placeholders.
all:
  vars:
    schema_version: 1
    deployment_mode: independent
    institution_id: south
    headscale_hostname: control.example.com
    derp_hostname: relay.example.com
    enrollment_admin: lab-admin
    derper_artifact: /absolute/path/to/artifacts/derper-linux-amd64
    derper_sha256: REPLACE_WITH_BUILD_SHA256
  children:
    peers:
      hosts:
        south-services:
          ansible_host: 192.0.2.10
          ansible_user: ubuntu
          node_tag: tag:south-services
    controller:
      hosts:
        north-control:
          ansible_host: 192.0.2.20
          ansible_user: ubuntu
          tls_certificate: /absolute/path/to/certificates/north-control.crt
          tls_private_key: /absolute/path/to/certificates/north-control.key
    relay:
      hosts:
        west-relay:
          ansible_host: 192.0.2.30
          ansible_user: ubuntu
          tls_certificate: /absolute/path/to/certificates/west-relay.crt
          tls_private_key: /absolute/path/to/certificates/west-relay.key
